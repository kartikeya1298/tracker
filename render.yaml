# Render Blueprint - deploys this app with no local terminal needed. On
# render.com: New -> Blueprint -> connect this repo -> Apply. After the first
# deploy, open the "Environment" tab on the backend service and fill in
# DATABASE_URL / ANTHROPIC_API_KEY / SMTP_* (left blank here on purpose - see
# below and the README's "Deploy to Render" section).
#
# No database resource is declared here on purpose: Render's own free Postgres
# expires and gets deleted after 30 days. Point DATABASE_URL at a free Neon
# (neon.tech) or Supabase project instead - both have a genuinely non-expiring
# free Postgres tier, so your job history/bookmarks/application tracker actually
# survives past a month at zero cost. Render's own paid Postgres works too if
# you'd rather keep everything on one platform.
#
# Redis is intentionally not provisioned either: REDIS_URL is declared in
# backend/app/config.py but never actually connected to anywhere in the app, so
# there's nothing here for it to do.
services:
  - type: web
    name: ds-career-tracker-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      # Paste a Neon/Supabase/Render-Postgres connection string here after the
      # first deploy. Any postgres://... or postgresql://... URL works -
      # database.py normalizes the scheme to the psycopg3 driver this app uses.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://ds-career-tracker-frontend.onrender.com"]'
      - key: PLAYWRIGHT_HEADLESS
        value: "true"
      - key: SCRAPE_INTERVAL_MINUTES
        value: "15"
      - key: INCLUDE_REMOTE
        value: "true"
      - key: INCLUDE_GLOBAL
        value: "false"
      - key: INCLUDE_INTERNSHIPS
        value: "false"
      - key: MAX_EXPERIENCE_YEARS
        value: "2.0"
      # Set these two in the Render dashboard after the first deploy - left
      # unset here since they're secrets and don't belong in a repo file.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFICATION_FROM_EMAIL
        sync: false
      - key: NOTIFICATION_TO_EMAILS
        sync: false

  - type: web
    name: ds-career-tracker-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Server-only (no NEXT_PUBLIC_ prefix) so it's read at request time, not
      # baked into the browser bundle at build time - see next.config.mjs.
      # Hardcoded rather than looked up via fromService: Render web service URLs
      # are deterministic (https://<name>.onrender.com) from the name above, and
      # this avoids depending on which fromService property maps to a full URL.
      - key: BACKEND_INTERNAL_URL
        value: https://ds-career-tracker-backend.onrender.com
